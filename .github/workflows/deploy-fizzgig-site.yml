# Publishes the small fizzgig.app website (home, privacy, terms; the pages the
# Google sign-in screen links to) from sites/fizzgig/. It's plain HTML, so there
# is no build. Runs only when that folder changes (or by hand), never starts an app build.
#
# Repository secrets: the same five SPACESHIP_* as the other deploy workflows, plus
#   SPACESHIP_FIZZGIG_PATH  absolute path of fizzgig.app's document root,
#                           e.g. /home/youruser/fizzgig.app
name: Deploy fizzgig.app

on:
  push:
    branches: [develop, master]
    paths: ['sites/fizzgig/**', '.github/workflows/deploy-fizzgig-site.yml']
  workflow_dispatch:

concurrency:
  group: deploy-fizzgig-site
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check secrets
        env:
          HOST: ${{ secrets.SPACESHIP_HOST }}
          USER: ${{ secrets.SPACESHIP_USER }}
          KEY: ${{ secrets.SPACESHIP_SSH_KEY }}
          DEST: ${{ secrets.SPACESHIP_FIZZGIG_PATH }}
        run: |
          missing=""
          [ -n "$HOST" ] || missing="$missing SPACESHIP_HOST"
          [ -n "$USER" ] || missing="$missing SPACESHIP_USER"
          [ -n "$KEY" ] || missing="$missing SPACESHIP_SSH_KEY"
          [ -n "$DEST" ] || missing="$missing SPACESHIP_FIZZGIG_PATH"
          if [ -n "$missing" ]; then
            echo "::error::Missing secrets:$missing"
            exit 1
          fi

      - name: Package
        run: |
          echo "${GITHUB_SHA::7}" > sites/fizzgig/version.txt
          tar -czf site.tar.gz -C sites/fizzgig .

      - name: Upload
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SPACESHIP_HOST }}
          port: ${{ secrets.SPACESHIP_PORT }}
          username: ${{ secrets.SPACESHIP_USER }}
          key: ${{ secrets.SPACESHIP_SSH_KEY }}
          passphrase: ${{ secrets.SPACESHIP_SSH_PASSPHRASE }}
          source: site.tar.gz
          target: fizzgig-deploy

      - name: Install on server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SPACESHIP_HOST }}
          port: ${{ secrets.SPACESHIP_PORT }}
          username: ${{ secrets.SPACESHIP_USER }}
          key: ${{ secrets.SPACESHIP_SSH_KEY }}
          passphrase: ${{ secrets.SPACESHIP_SSH_PASSPHRASE }}
          script: |
            set -e
            DEST="${{ secrets.SPACESHIP_FIZZGIG_PATH }}"
            WORK="$HOME/fizzgig-deploy"
            [ -d "$DEST" ] || { echo "Site folder $DEST doesn't exist. Create fizzgig.app's site folder in cPanel first."; exit 1; }
            rm -rf "$WORK/site" && mkdir -p "$WORK/site"
            tar -xzf "$WORK/site.tar.gz" -C "$WORK/site"
            if command -v rsync >/dev/null; then
              rsync -a --delete --exclude .well-known --exclude cgi-bin "$WORK/site/" "$DEST/"
            else
              find "$DEST" -mindepth 1 -maxdepth 1 ! -name .well-known ! -name cgi-bin -exec rm -rf {} +
              cp -a "$WORK/site/." "$DEST/"
            fi
            rm -rf "$WORK/site" "$WORK/site.tar.gz"
            echo "Deployed $(cat "$DEST/version.txt") to $DEST"
