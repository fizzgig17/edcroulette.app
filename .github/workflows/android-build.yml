# Builds the Android app: a signed APK you can install on a phone to test, and an
# AAB (the file Google Play takes). Download them from the run's page, under
# "Artifacts" at the bottom.
#
# Start it: push a commit whose message contains [android], or Actions > Build
# Android app > Run workflow (pick the branch). develop builds use the dev
# backend and are named "EDC Roulette Dev"; master builds use production.
#
# Signing secrets (repo > Settings > Secrets and variables > Actions):
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
# Without them the build still works, signed with a throwaway key: fine for
# trying it on your phone, but Google Play won't take it.
#
# Google Play upload: master builds are sent to the Closed testing track when the
# secret PLAY_SERVICE_ACCOUNT_JSON (the service account's JSON key) exists and the build
# is signed with your upload key. Needs the app created in Play Console and its first
# release uploaded by hand. develop builds are never uploaded.
name: Build Android app

# Needed to record each release as a tag (android-YYYY.M.D.N).
permissions:
  contents: write

on:
  push:
    branches: [develop, master]
  workflow_dispatch:

concurrency:
  # Not cancelling: a later push that doesn't build (no [android]) would otherwise stop a running build.
  group: android-build-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[android]')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      BUILD_NUMBER: ${{ github.run_number }}
      KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      FACEBOOK_CLIENT_ID: ${{ secrets.FACEBOOK_CLIENT_ID }}
      PLAY_KEY: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install JS dependencies
        run: npm ci

      - name: Choose the Supabase project and name the build
        run: |
          if [ -n "$GOOGLE_CLIENT_ID" ]; then echo "EXPO_PUBLIC_GOOGLE_SIGNIN=1" >> "$GITHUB_ENV"; fi
          if [ -n "$FACEBOOK_CLIENT_ID" ]; then echo "EXPO_PUBLIC_FACEBOOK_SIGNIN=1" >> "$GITHUB_ENV"; fi
          if [ "$GITHUB_REF_NAME" = "master" ]; then
            grep -E '^EXPO_PUBLIC_[A-Z_]+=' config/prod.env >> "$GITHUB_ENV"
            echo "TARGET=production" >> "$GITHUB_ENV"
          else
            echo "TARGET=development" >> "$GITHUB_ENV"
            jq '.expo.name = "EDC Roulette Dev"' app.json > app.json.tmp && mv app.json.tmp app.json
          fi
          # Each upload to Google Play needs a higher versionCode.
          jq --argjson n "$BUILD_NUMBER" '.expo.android.versionCode = $n' app.json > app.json.tmp && mv app.json.tmp app.json
          # Android versions are YYYY.M.D.N: today's date (US Eastern) and the number of the
          # release that day, the same as hCRI Companion. N counts the android-YYYY.M.D.* tags.
          TODAY=$(TZ=America/New_York date +%Y.%-m.%-d)
          N=$(( $(git tag -l "android-$TODAY.*" | wc -l) + 1 ))
          echo "ANDROID_VERSION=$TODAY.$N" >> "$GITHUB_ENV"
          jq --arg v "$TODAY.$N" '.expo.version = $v' app.json > app.json.tmp && mv app.json.tmp app.json
          echo "Version $TODAY.$N (code $BUILD_NUMBER), $TARGET"

      - name: Create the Android project
        run: CI=1 npx expo prebuild --platform android --no-install --clean

      - name: Set up signing
        run: |
          mkdir -p "$RUNNER_TEMP/signing"
          if [ -n "$KEYSTORE_B64" ] && [ -n "$KEYSTORE_PASSWORD" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/signing/release.keystore"
            ALIAS="${KEY_ALIAS:-edcroulette}"; KPASS="${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"; SPASS="$KEYSTORE_PASSWORD"
            echo "SIGNING=your upload key" >> "$GITHUB_ENV"
          else
            echo "::warning::No Android signing secrets, so this build uses a throwaway key. It installs on a phone but Google Play will not accept it."
            SPASS=throwaway-key; KPASS=throwaway-key; ALIAS=throwaway
            keytool -genkeypair -storetype PKCS12 -keystore "$RUNNER_TEMP/signing/release.keystore" -alias "$ALIAS" \
              -keyalg RSA -keysize 2048 -validity 10000 -storepass "$SPASS" -keypass "$KPASS" -dname "CN=EDC Roulette test" >/dev/null
            echo "SIGNING=a throwaway key" >> "$GITHUB_ENV"
          fi
          echo "::add-mask::$SPASS"; echo "::add-mask::$KPASS"
          {
            echo "BB_STORE_FILE=$RUNNER_TEMP/signing/release.keystore"
            echo "BB_STORE_PASSWORD=$SPASS"
            echo "BB_KEY_ALIAS=$ALIAS"
            echo "BB_KEY_PASSWORD=$KPASS"
          } >> "$GITHUB_ENV"
          # Tell Gradle to sign release builds with it.
          python3 .github/scripts/android-signing.py

      # develop builds make only the APK (installed directly, put on the dev website); master builds
      # make only the AAB (what Google Play takes). Building both would double a very long step.
      - name: Build the APK (develop) or AAB (master)
        working-directory: android
        run: |
          set -o pipefail
          if [ "$GITHUB_REF_NAME" = "master" ]; then TASK=bundleRelease; else TASK=assembleRelease; fi
          ./gradlew "$TASK" --no-daemon --console=plain -q 2>&1 | tee ../gradle.log

      # Run logs can't be downloaded, so surface the cause as annotations on the run's page.
      - name: Show why the build failed
        if: failure()
        run: |
          grep -E "error:|^e: |FAILED|What went wrong|Execution failed|Could not |Exception|Unresolved|Duplicate|AAPT|Lint" gradle.log | head -n 20 | while IFS= read -r line; do echo "::error::${line:0:400}"; done || true

      - name: Show the signing fingerprint
        run: |
          keytool -list -v -keystore "$BB_STORE_FILE" -storepass "$BB_STORE_PASSWORD" 2>/dev/null | grep -E "SHA1|SHA256" | head -2 | sed 's/^ *//' | while read -r line; do echo "::notice::Signed with $SIGNING. $line"; done

      - name: Keep the build files
        run: |
          mkdir -p out
          if [ "$GITHUB_REF_NAME" = "master" ]; then
            cp android/app/build/outputs/bundle/release/*.aab out/edc-roulette-${TARGET}-${BUILD_NUMBER}.aab
          else
            cp android/app/build/outputs/apk/release/*.apk out/edc-roulette-${TARGET}-${BUILD_NUMBER}.apk
          fi
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: edc-roulette-android-${{ github.run_number }}
          path: out/
          retention-days: 30

      # develop builds: put the APK on the dev website so it can be downloaded with one tap
      # (https://dev.edcroulette.app/downloads/edc-roulette-dev.apk). Needs the same server
      # secrets as the website deploy; without them this step is skipped.
      - name: Check website upload secrets
        id: site
        env:
          HOST: ${{ secrets.SPACESHIP_HOST }}
          DEST: ${{ secrets.SPACESHIP_DEV_PATH }}
        run: |
          if [ "$GITHUB_REF_NAME" = "develop" ] && [ -n "$HOST" ] && [ -n "$DEST" ]; then echo "go=true" >> "$GITHUB_OUTPUT"; fi
      - name: Send the APK to the website
        if: steps.site.outputs.go == 'true'
        continue-on-error: true
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SPACESHIP_HOST }}
          port: ${{ secrets.SPACESHIP_PORT }}
          username: ${{ secrets.SPACESHIP_USER }}
          key: ${{ secrets.SPACESHIP_SSH_KEY }}
          passphrase: ${{ secrets.SPACESHIP_SSH_PASSPHRASE }}
          source: out/*.apk
          target: edcroulette-deploy/apk
          strip_components: 1
          overwrite: true
      - name: Publish the APK on the website
        if: steps.site.outputs.go == 'true'
        continue-on-error: true
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SPACESHIP_HOST }}
          port: ${{ secrets.SPACESHIP_PORT }}
          username: ${{ secrets.SPACESHIP_USER }}
          key: ${{ secrets.SPACESHIP_SSH_KEY }}
          passphrase: ${{ secrets.SPACESHIP_SSH_PASSPHRASE }}
          script: |
            set -e
            DEST="${{ secrets.SPACESHIP_DEV_PATH }}/downloads"
            mkdir -p "$DEST"
            cp "$HOME"/edcroulette-deploy/apk/*.apk "$DEST/edc-roulette-dev.apk"
            rm -f "$HOME"/edcroulette-deploy/apk/*.apk
            printf '{"version":"%s","built":"%s"}\n' "${{ env.ANDROID_VERSION }}" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > "$DEST/latest.json"
            echo "Published $DEST/edc-roulette-dev.apk"

      - name: Decide whether to upload to Google Play
        id: play
        run: |
          if [ "$GITHUB_REF_NAME" = "master" ] && [ -n "$PLAY_KEY" ] && [ "$SIGNING" = "your upload key" ]; then
            echo "go=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Not uploading to Google Play (needs a master build, the PLAY_SERVICE_ACCOUNT_JSON secret and the upload key)."
          fi
      - name: Upload to Google Play (Closed testing)
        id: play_up
        if: steps.play.outputs.go == 'true'
        continue-on-error: true
        uses: r0adkll/upload-google-play@v1.1.3
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: app.edcroulette.android
          releaseFiles: out/*.aab
          track: alpha
          status: completed
      # A brand-new app that has not been published yet only accepts draft releases;
      # the draft then needs a click on "Roll out" in Play Console.
      - name: Upload as a draft release instead
        if: steps.play.outputs.go == 'true' && steps.play_up.outcome == 'failure'
        uses: r0adkll/upload-google-play@v1.1.3
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: app.edcroulette.android
          releaseFiles: out/*.aab
          track: alpha
          status: draft

      # Remember this release so the next one that day gets the next number.
      - name: Tag the release
        if: steps.play.outputs.go == 'true'
        continue-on-error: true
        run: |
          git tag "android-$ANDROID_VERSION"
          git push origin "android-$ANDROID_VERSION"
