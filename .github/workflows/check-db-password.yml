# Checks that the DEV_DB_PASSWORD / PROD_DB_PASSWORD secrets work, by connecting
# and running `select 1`. Read-only: it never changes the database.
#
# Use it after adding or changing a password secret:
#   Actions > Check database password > Run workflow > pick dev or prod.
# A wrong password fails with "password authentication failed".
name: Check database password

on:
  workflow_dispatch:
    inputs:
      target:
        description: Which project
        type: choice
        options: [dev, prod]
        default: dev

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      TARGET: ${{ inputs.target }}
      DEV_PROJECT_ID: ${{ secrets.DEV_PROJECT_ID }}
      DEV_DB_PASSWORD: ${{ secrets.DEV_DB_PASSWORD }}
      PROD_PROJECT_ID: ${{ secrets.PROD_PROJECT_ID }}
      PROD_DB_PASSWORD: ${{ secrets.PROD_DB_PASSWORD }}
      POOLER_HOST: aws-0-us-east-1.pooler.supabase.com
    steps:
      - name: Connect to ${{ inputs.target }}
        run: |
          if [ "$TARGET" = prod ]; then PROJECT_ID="$PROD_PROJECT_ID"; PGPASSWORD="$PROD_DB_PASSWORD"; else PROJECT_ID="$DEV_PROJECT_ID"; PGPASSWORD="$DEV_DB_PASSWORD"; fi
          [ -n "$PROJECT_ID" ] || { echo "::error::The ${TARGET^^}_PROJECT_ID secret is missing"; exit 1; }
          [ -n "$PGPASSWORD" ] || { echo "::error::The ${TARGET^^}_DB_PASSWORD secret is missing"; exit 1; }
          export PGPASSWORD PGCONNECT_TIMEOUT=15
          if out=$(psql -h "$POOLER_HOST" -p 5432 -U "postgres.$PROJECT_ID" -d postgres -Atc 'select 1' 2>&1); then
            echo "::notice::The $TARGET database password works (project $PROJECT_ID)."
          else
            echo "::error::Could not connect to $TARGET: $(printf '%s' "$out" | tr '\n' ' ' | head -c 300)"
            exit 1
          fi
